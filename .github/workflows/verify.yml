name: Verify portable archive
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-and-query:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore and verify offline snapshot
        run: python setup_archive.py
      - name: Check corpus and scope rules
        run: python -m unittest discover -s tests -v
      - name: Install optional MCP client/server
        run: python -m pip install -r requirements-mcp.txt
      - name: Verify actual MCP round trip
        run: python scripts/test_mcp.py
